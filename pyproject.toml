[project]
name = "testmcpservice"
version = "0.0.1"
description = "ComplianceCow MCP servers for compliance insights, rule automation, workflows, metrics, and issue command operations."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "httpx>=0.28.1",
    # "mcp[cli]>=1.9.3",
    "fastmcp==2.13.0",
    "aiohttp==3.12.14",
    "pandas==2.3.1",
    "PyYAML==6.0.2",
    "toml>=0.10.2",
    "ruamel.yaml==0.18.14",
    "requests==2.32.4",
    "django==5.2.8",
    "cachetools==6.2.1",
    "uvicorn[standard]==0.38.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
testmcpservice = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/__pycache__",
    "/assets",
    "/build",
    "/cowmcpservice.egg-info",
    "/dist",
    "/docs",
    "/my-app",
    "/reports",
    "/test",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "tools",
    "utils",
    "mcpconfig",
    "constants",
    "resources",
    "prompts",
    "mcptypes",
]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.hatch.build.targets.sdist]
include = [
    "main.py",
    "pyproject.toml",
    "README.md",
    "tools/**",
    "utils/**",
    "mcpconfig/**",
    "constants/**",
    "resources/**",
    "prompts/**",
    "mcptypes/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
